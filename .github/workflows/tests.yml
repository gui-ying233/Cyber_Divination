name: Historical cases

on: [push, pull_request]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements.txt
      - name: Run historical cases
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          python -m coverage erase
          python -S -B -m unittest -v tests
      - name: Generate coverage report
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: coverage.xml
          archive: false
          if-no-files-found: error
          retention-days: 1

  report:
    needs: test
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage.xml
      - name: Report coverage to DeepSource
        env:
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL --retry 3 https://cli.deepsource.com/install | BINDIR="$RUNNER_TEMP/deepsource" sh
          "$RUNNER_TEMP/deepsource/deepsource" report --analyzer test-coverage --key python --value-file coverage.xml --commit "$GIT_COMMIT_SHA" --use-oidc
